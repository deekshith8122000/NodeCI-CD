name: Node.js CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t ${{ secrets.deekshithssuvarna }}/cicd:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.deekshithssuvarna }}
          password: ${{ secrets.dckr_pat_y1kuYCAQVbtYh9L6cd5LQP25WmY }}

      - name: Push Docker Image
        run: docker push ${{ secrets.deekshithssuvarna }}/cicd:latest